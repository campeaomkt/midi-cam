    <script>
      // Emscripten Module pre-initialization for FluidSynth WASM
      var Module = window.Module = window.Module || {};
      window.Module.calledRun = false;
      window.__fluidsynth_ready_promise = new Promise(function(resolve) {
        var checkReady = function() {
          var m = window.Module;
          if (m && (m.calledRun || (typeof m.addFunction === 'function' && typeof m.cwrap === 'function'))) {
            m.isReady = true;
            resolve(m);
            return true;
          }
          return false;
        };
        window.__onWasmReady = function(mod) {
          resolve(mod || window.Module);
        };
        var prevOnRuntimeInitialized = window.Module.onRuntimeInitialized;
        window.Module.onRuntimeInitialized = function() {
          if (typeof prevOnRuntimeInitialized === 'function') {
            try { prevOnRuntimeInitialized(); } catch(e) {}
          }
          window.Module.calledRun = true;
          window.Module.isReady = true;
          console.log('[FluidSynth WASM] onRuntimeInitialized fired, WASM module fully ready');
          resolve(window.Module);
        };
        if (checkReady()) return;
      });
    </script>
