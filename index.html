    <meta property="og:title" content="MIDI Camera & Chord Recorder" />
    <meta property="og:description" content="Camera app with real-time video filters, connected MIDI keyboard overlay, and live chord detection." />
    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#0a0a0c" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
      // Global diagnostic error safety net for desktop / Tauri / mobile
      window.addEventListener('error', function(e) {
        console.error('[GlobalError]', e.error || e.message);
        var r = document.getElementById('root');
        if (r && !r.hasChildNodes()) {
          r.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#050508;color:#fff;font-family:sans-serif;padding:24px;text-align:center;">' +
            '<h2 style="color:#f59e0b;margin-bottom:8px;">Inicializando MIDI Cam...</h2>' +
            '<p style="color:#aaa;font-size:13px;max-width:380px;margin-bottom:16px;">Ocorreu uma falha no carregamento. Clique abaixo para recarregar.</p>' +
            '<button onclick="location.reload()" style="background:#f59e0b;color:#000;font-weight:bold;border:none;border-radius:10px;padding:10px 20px;cursor:pointer;">Recarregar</button>' +
            '</div>';
        }
      });
      // Emscripten Module pre-initialization for FluidSynth WASM
      var Module = window.Module = window.Module || {};
      window.Module.calledRun = false;
      window.__fluidsynth_ready_promise = new Promise(function(resolve) {
        var checkReady = function() {
          var m = window.Module;
          if (m && (m.calledRun || (typeof m.addFunction === 'function' && typeof m.cwrap === 'function'))) {
            m.isReady = true;
            resolve(m);
            return true;
          }
          return false;
        };
        window.__onWasmReady = function(mod) {
          resolve(mod || window.Module);
        };
        var prevOnRuntimeInitialized = window.Module.onRuntimeInitialized;
        window.Module.onRuntimeInitialized = function() {
          if (typeof prevOnRuntimeInitialized === 'function') {
            try { prevOnRuntimeInitialized(); } catch(e) {}
          }
          window.Module.calledRun = true;
          window.Module.isReady = true;
          console.log('[FluidSynth WASM] onRuntimeInitialized fired, WASM module fully ready');
          resolve(window.Module);
        };
        if (checkReady()) return;
      });
    </script>
    <script src="/fluidsynth/libfluidsynth-2.4.6.js"></script>
    <script src="/fluidsynth/js-synthesizer.js"></script>
  </head>
  <body class="bg-black text-white antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
